# Copy to ~/.sbxenv.yaml with this checkout's absolute path filled in, then
# set your options there:
#
#   sed "s|/path/to/sbxenv|$PWD|" sbxenv.example.yaml > ~/.sbxenv.yaml
#
# Kit paths must be absolute: relative paths and ${{ env.fileDir }} resolve
# against the env file's directory (~ here), and ~ is not expanded.
schemaVersion: "1"
agent: shell
kits:
  - docker.io/sbx/shell:1.1.0
  # Mixin tags pin the kit (hooks, allow list) and the agent's starting
  # version; the agents then update themselves. Bump on upgrade.
  - docker.io/sbx/claude-mixin:2.1.323
  - docker.io/sbx/codex-mixin:0.167.2
  # - docker.io/sbx/cursor-mixin:2026.11.11-043ef28
  # Pi, instead of the Claude kits: both own the anthropic credential.
  # - docker.io/sbx/pi-mixin:1.5.2
  # Keep the agents' sessions on the host, per sandbox name, across
  # sbx env rm (docs/sandboxes.md: Recreate). Each needs its agent's mixin.
  - docker.io/sbx/claude-sessions:1.1.0
  - docker.io/sbx/codex-sessions:1.1.0
  # - docker.io/sbx/cursor-sessions:1.0.0
  # - docker.io/sbx/pi-sessions:1.1.0
  - source: /path/to/sbxenv/kits/config
    args:
      # Dotfiles repo for `chezmoi init --apply` at create, e.g. you/dotfiles
      # (forms: kits/config/config.yaml). Empty = skip.
      dotfiles: ""
  # Your own kit, by absolute path, allowing hosts your dotfiles or tools
  # need (docs/dotfiles.md: Allow more hosts).
  # - /absolute/path/to/egress
workspace:
  path: ${{ env.projectDir }}
  clone: true
# Create-time knobs, such as disk sizes (docs/sandboxes.md: Disks).
# sandboxOptions:
#   clonedWorkspaceSize: "100g"
