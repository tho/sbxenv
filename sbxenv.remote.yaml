# Download to ~/.sbxenv.yaml, then set your options there. sbx fetches the
# local kit from GitHub at the commit in ref=, so you need no checkout, but
# you must allow the source once (README: Install without a checkout).
#
# ref= is the last commit that changed kits/config.
schemaVersion: "1"
agent: sbx-kit-shell
kits:
  - docker.io/docker/sbx-kit-shell:1.0.0
  # Mixin tags pin the kit (hooks, volumes, allow list) and the agent's
  # starting version; the agents then update themselves. Bump on upgrade.
  - docker.io/docker/sbx-kit-claude-mixin:2.1.314
  - docker.io/docker/sbx-kit-codex-mixin:0.166.0
  # Docker publishes copilot-mixin, and cursor-mixin with a pinned agent, only
  # under sbx/. Read the registry descriptor before bumping.
  # - docker.io/sbx/copilot-mixin:1.0.86
  # - docker.io/sbx/cursor-mixin:2026.09.18-9a7762b
  - source: git+https://github.com/tho/sbxenv.git#ref=91c36dad7425281e74fecbe0b2e19a7d38ab1efd&dir=kits/config
    args:
      # Dotfiles repo for `chezmoi init --apply` at create, e.g. you/dotfiles
      # (forms: kits/config/config.yaml). Empty = skip.
      dotfiles: ""
  # Your own kit allowing hosts that your dotfiles or tools need beyond the
  # kits' allow lists, such as an installer's download host. Absolute path
  # (docs/dotfiles.md: Allow more hosts).
  # - /absolute/path/to/egress
workspace:
  path: ${{ env.projectDir }}
  clone: true
