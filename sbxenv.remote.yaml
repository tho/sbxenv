# Download to ~/.sbxenv.yaml, then set your options there. sbx fetches the
# local kit from GitHub at the commit in ref=, so you need no checkout, but
# you must allow the source once (README: Install without a checkout).
#
# ref= is the last commit that changed kits/config.
schemaVersion: "1"
agent: shell
kits:
  # Docker publishes its kits under sbx/ since v0.51.0; the docker/sbx-kit-*
  # kits are frozen at their last tags.
  - docker.io/sbx/shell:1.0.3
  # Mixin tags pin the kit (hooks, allow list) and the agent's starting
  # version; the agents then update themselves. Bump on upgrade.
  - docker.io/sbx/claude-mixin:2.1.318
  # Keeps ~/.claude/projects and siblings in one host directory that every
  # sandbox using this kit shares, and that survives sbx env rm
  # (docs/sandboxes.md: Recreate). Drop it for a fresh $HOME every time.
  - docker.io/sbx/claude-sessions:1.0.0
  - docker.io/sbx/codex-mixin:0.166.0
  # Read the registry descriptor before bumping.
  # - docker.io/sbx/cursor-mixin:2026.09.18-9a7762b
  - source: git+https://github.com/tho/sbxenv.git#ref=38a1c1184a8615c2b09b80279dea6be657609bb9&dir=kits/config
    args:
      # Dotfiles repo for `chezmoi init --apply` at create, e.g. you/dotfiles
      # (forms: kits/config/config.yaml). Empty = skip.
      dotfiles: ""
  # Your own kit allowing hosts that your dotfiles or tools need beyond the
  # kits' allow lists, such as an installer's download host. Absolute path
  # (docs/dotfiles.md: Allow more hosts).
  # - /absolute/path/to/egress
workspace:
  path: ${{ env.projectDir }}
  clone: true
# Create-time knobs, such as disk sizes (docs/sandboxes.md: Disks).
# sandboxOptions:
#   clonedWorkspaceSize: "100g"
