# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: sbxenv config
description: "Sandbox setup for sbxenv: a pinned, SHA-256-verified chezmoi binary at /usr/local/bin, your dotfiles applied at create when the dotfiles arg is set, git identity, bash login shell, less and vim as the default pager and editor, and git ignores for in-repo worktrees."
sourceUrl: https://github.com/tho/sbxenv

kind: mixin

# Bump on any change, pin bumps included, so `sbx env plan` shows the kit as
# changed.
version: "0.1.12"

# The recipe's per-arch digests pin chezmoiVersion: another version fails
# the build. To bump it, see kits/README.md.
args:
  chezmoiVersion:
    default: "2.73.3"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: chezmoi release to install (no leading v)
    buildArg: CHEZMOI_VERSION
  # Reaches the hooks as $SBXENV_DOTFILES, never interpolated. The pattern
  # admits only HTTPS forms, since the sandbox has no SSH key: a shorthand
  # path or an https:// URL, starting with a letter or digit, so no value
  # parses as a flag, an absolute path or another scheme.
  dotfiles:
    default: ""
    pattern: '^$|^(https://[A-Za-z0-9.-]+(:[0-9]+)?/~?)?[A-Za-z0-9][A-Za-z0-9._~/-]*$'
    description: |
      Dotfiles repo for `chezmoi init --apply` at create, in any HTTPS form
      chezmoi accepts: `user`, `user/repo`, `site/user[/repo]`,
      `sr.ht/~user[/repo]` or `https://host/path`. Empty = skip.
    env: SBXENV_DOTFILES

provides:
  - "chezmoi@${{ kit.args.chezmoiVersion }}"

# The agent mixins' hooks, when present, run first: claude-mixin, codex-mixin
# and pi-mixin overwrite ~/.claude/settings.json, ~/.codex/config.toml and
# ~/.pi/agent/settings.json, so dotfiles that edit one of them aren't
# clobbered.
integrates: ["claude", "codex", "cursor", "pi"]

capabilities:
  # The host's git user.name and user.email, set before the hooks run so
  # dotfiles prompts can default to them. Optional: the sandbox starts
  # without them.
  - type: com.docker.sandbox/git-identity@1
    optional: true
    description: Attribute commits to your Git identity

  - type: com.docker.sandbox/network-policy@1
    config:
      # Open only while install hooks run, for the dotfiles: GitHub clones
      # and downloads. Other forges: docs/dotfiles.md, Allow more hosts.
      install:
        allow:
          - github.com
          - codeload.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - raw.githubusercontent.com
      # The image's apt sources, for dotfiles that install packages. Both,
      # since apt-get update fails on any it can't reach.
      runtime:
        allow:
          - deb.debian.org
          - dhi.io

  # Hooks run in list order, after the agent mixins' (integrates above).
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # bash as the agent's passwd shell, as `sbx env run` uses, for tools
        # that read it when $SHELL is unset (e.g. tmux under `sbx exec`).
        # Replaces only sh, dash or none, so a dotfiles-chosen shell survives.
        - command: |
            set -eu
            current=$(getent passwd agent | cut -d: -f7)
            case $current in
              ''|/bin/sh|/usr/bin/sh|/bin/dash|/usr/bin/dash) usermod -s /bin/bash agent ;;
            esac
          user: "0"
          description: Make bash the agent's login shell

        # With none configured, Debian's git runs `pager` and `editor`, but the
        # image ships less and vim.basic without the alternatives their
        # postinsts register, so `git diff` and `git commit` fail in a
        # terminal. Registers them as the postinsts do, with the same
        # priorities, skipping names that exist or targets that don't.
        - command: |
            set -eu
            for alt in pager:less:77 editor:vim.basic:30 vi:vim.basic:30 vim:vim.basic:30; do
              name=${alt%%:*} rest=${alt#*:}
              command -v "$name" >/dev/null && continue
              target=$(command -v "${rest%%:*}") || continue
              update-alternatives --quiet --install "/usr/bin/$name" "$name" "$target" "${rest#*:}"
            done
          user: "0"
          description: Register less and vim.basic as the pager, editor, vi and vim alternatives

        # Keeps in-repo worktrees (.worktrees/ and Claude Code's
        # .claude/worktrees/) out of `git status`, through the clone's
        # .git/info/exclude, which git reads whatever core.excludesFile says.
        # sbx has cloned the workspace by the time install hooks run. Adds
        # only missing lines; skipped when the workspace isn't a git repo.
        - command: |
            set -u
            f=$(git -C "${WORKSPACE_DIR:-.}" rev-parse --path-format=absolute --git-path info/exclude 2>/dev/null) || exit 0
            mkdir -p "$(dirname "$f")" && touch "$f" || exit 0
            [ ! -s "$f" ] || [ -z "$(tail -c1 "$f")" ] || echo >>"$f"
            for p in .worktrees/ .claude/worktrees/; do
              grep -qxF "$p" "$f" || printf '%s\n' "$p" >>"$f"
            done
          user: agent
          env: [WORKSPACE_DIR]
          description: Ignore in-repo worktree directories in the workspace clone

        # From the workspace, so .chezmoi.commandDir points there and dotfiles
        # scripts can write project-level config. --promptDefaults (every
        # template prompt needs a default) and --force keep it unattended. A
        # failed apply is reported, not fatal: it can be rerun.
        - command: |
            set -u
            [ -n "${SBXENV_DOTFILES:-}" ] || exit 0
            export GIT_TERMINAL_PROMPT=0
            cd "${WORKSPACE_DIR:-$HOME}" || exit 1
            /usr/local/bin/chezmoi init --apply --no-tty --promptDefaults --force -- "$SBXENV_DOTFILES" || {
              echo "config kit: chezmoi init --apply $SBXENV_DOTFILES failed; rerun it from $PWD by hand" >&2
            }
          user: agent
          env: [SBXENV_DOTFILES, WORKSPACE_DIR]
          description: chezmoi init --apply the dotfiles repo (skipped when dotfiles is empty)
