# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: rsync
description: "rsync from Debian's repositories, so scripts/sbx-state-sync.sh can carry Claude Code state between the sandbox and the host with `rsync -e 'sbx exec -i'`. Declaration-only (no recipe)."
sourceUrl: https://github.com/tho/sbxenv

kind: mixin

# Bump on any change, so `sbx env plan` shows the kit as changed.
version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # The image's apt source, open only while install hooks run. The image
      # also lists dhi.io, which stays blocked, so apt-get update may warn
      # about it.
      install:
        allow:
          - deb.debian.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # apt-get update may exit non-zero over the blocked dhi.io source, so
        # the install doesn't depend on its status. The sandbox works without
        # rsync (only the sync script needs it, and it says so when rsync is
        # missing), so a failed install is reported, not fatal.
        - command: |
            set -u
            export DEBIAN_FRONTEND=noninteractive
            apt-get update || true
            apt-get install -y --no-install-recommends rsync || {
              echo "rsync kit: apt-get install rsync failed; rerun it as root by hand" >&2
            }
            rm -rf /var/lib/apt/lists/*
            exit 0
          user: "0"
          description: Install rsync with apt-get
